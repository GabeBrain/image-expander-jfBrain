<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fullscreen Image Viewer - JF Brain</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --surface: #1e293b;
      --primary: #84cc16;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .viewer-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 4vw, 32px);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 880px;
      max-height: 640px;
      height: 100%;
      background: var(--surface);
      border-radius: clamp(12px, 2vw, 20px);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
    }

    .card__image-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: zoom-in;
      background: #000;
    }

    .card__image-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
      display: block;
    }

    .zoom-hint {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      padding: 8px;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .zoom-hint svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .nav-bar {
      height: 60px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0;
    }

    .nav-btn {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .nav-btn:active {
      background: rgba(0, 0, 0, 0.15);
    }

    .nav-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .counter-badge {
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      color: #fff;
    }

    .placeholder {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: all;
    }

    :fullscreen .lightbox,
    :-webkit-full-screen .lightbox {
      width: 100vw;
      height: 100vh;
    }

    .lightbox__header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: clamp(12px, 4vw, 32px);
      display: flex;
      justify-content: flex-end;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .lightbox__canvas {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    .lightbox__canvas img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
      cursor: grab;
    }

    .lightbox__canvas img:active {
      cursor: grabbing;
    }

    .float-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 50;
      display: none;
    }

    @media (min-width: 768px) {
      .float-nav {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    .float-prev {
      left: clamp(12px, 4vw, 32px);
    }

    .float-next {
      right: clamp(12px, 4vw, 32px);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="viewer-container">
    <div id="mainCard" class="card hidden">
      <div id="zoomTrigger" class="card__image-area">
        <img id="mainImage" alt="Imagem principal" draggable="false" />
        <div class="zoom-hint" aria-hidden="true">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
        </div>
      </div>
      <div class="nav-bar">
        <button id="btnPrev" class="nav-btn" type="button">
          <span>&larr;</span> Anterior
        </button>
        <span id="counter" class="counter-badge">0 / 0</span>
        <button id="btnNext" class="nav-btn" type="button">
          Proximo <span>&rarr;</span>
        </button>
      </div>
    </div>
    <div id="placeholder" class="placeholder">Carregando imagens...</div>
  </div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
    <div class="lightbox__header">
      <button id="btnClose" class="close-btn" type="button" aria-label="Fechar">&times;</button>
    </div>
    <button id="floatPrev" class="float-nav float-prev" type="button" aria-label="Imagem anterior">&lsaquo;</button>
    <div id="lightboxCanvas" class="lightbox__canvas">
      <img id="lightboxImage" alt="Imagem ampliada" draggable="false" />
    </div>
    <button id="floatNext" class="float-nav float-next" type="button" aria-label="Proxima imagem">&rsaquo;</button>
  </div>

  <script>
    (() => {
      const MAX_FILES = 15;
      const MAX_ZOOM = 4;
      const MIN_ZOOM = 1;

      const elements = {
        card: document.getElementById('mainCard'),
        placeholder: document.getElementById('placeholder'),
        mainImage: document.getElementById('mainImage'),
        zoomTrigger: document.getElementById('zoomTrigger'),
        btnPrev: document.getElementById('btnPrev'),
        btnNext: document.getElementById('btnNext'),
        counter: document.getElementById('counter'),
        lightbox: document.getElementById('lightbox'),
        lightboxCanvas: document.getElementById('lightboxCanvas'),
        lightboxImage: document.getElementById('lightboxImage'),
        btnClose: document.getElementById('btnClose'),
        floatPrev: document.getElementById('floatPrev'),
        floatNext: document.getElementById('floatNext'),
      };

      const state = {
        images: [],
        activeIndex: 0,
      };

      const zoomState = {
        scale: 1,
        translateX: 0,
        translateY: 0,
        pointerId: null,
        lastX: 0,
        lastY: 0,
        panning: false,
      };

      const pinchState = {
        startDistance: 0,
        startScale: 1,
        active: false,
      };

      const pointerMap = new Map();
      let jotformBridgeReady = false;

      const serializeImages = () => JSON.stringify(state.images);

      const sendCurrentValue = (context = 'sync') => {
        if (window.JFCustomWidget?.sendData) {
          window.JFCustomWidget.sendData({ value: serializeImages(), context });
        }
      };

      const requestFullscreen = () => {
        const target = elements.lightbox;
        if (target.requestFullscreen) {
          target.requestFullscreen().catch(() => {});
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        } else if (target.msRequestFullscreen) {
          target.msRequestFullscreen();
        }
      };

      const exitFullscreen = () => {
        if (document.fullscreenElement) {
          document.exitFullscreen?.().catch(() => {});
        } else if (document.webkitFullscreenElement) {
          document.webkitExitFullscreen?.();
        }
      };

      const updateNavigation = () => {
        const disablePrev = state.activeIndex <= 0;
        const disableNext = state.activeIndex >= state.images.length - 1;
        elements.btnPrev.disabled = disablePrev;
        elements.btnNext.disabled = disableNext;
        elements.floatPrev.style.display = disablePrev ? 'none' : 'flex';
        elements.floatNext.style.display = disableNext ? 'none' : 'flex';
      };

      const updateMainView = () => {
        if (!state.images.length) {
          elements.card.classList.add('hidden');
          elements.placeholder.classList.remove('hidden');
          elements.placeholder.textContent = 'Nenhuma imagem disponivel.';
          elements.counter.textContent = '0 / 0';
          updateNavigation();
          return;
        }

        elements.placeholder.classList.add('hidden');
        elements.card.classList.remove('hidden');

        const current = state.images[state.activeIndex];
        elements.mainImage.src = current.url;
        elements.mainImage.alt = current.name || `Imagem ${state.activeIndex + 1}`;
        elements.counter.textContent = `${state.activeIndex + 1} / ${state.images.length}`;
        updateNavigation();
      };

      const updateLightboxImage = () => {
        if (!state.images.length) return;
        const current = state.images[state.activeIndex];
        elements.lightboxImage.style.opacity = '0.5';
        requestAnimationFrame(() => {
          elements.lightboxImage.src = current.url;
          elements.lightboxImage.alt = current.name || `Imagem ${state.activeIndex + 1}`;
          elements.lightboxImage.onload = () => {
            elements.lightboxImage.style.opacity = '1';
          };
        });
      };

      const openLightbox = () => {
        if (!state.images.length) return;
        elements.lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
        resetZoom();
        updateLightboxImage();
        requestFullscreen();
      };

      const closeLightbox = () => {
        elements.lightbox.classList.remove('active');
        document.body.style.overflow = '';
        exitFullscreen();
        resetZoom();
      };

      const showImageOffset = (offset) => {
        if (!state.images.length) return;
        const nextIndex = state.activeIndex + offset;
        if (nextIndex < 0 || nextIndex >= state.images.length) return;
        state.activeIndex = nextIndex;
        updateMainView();
        if (elements.lightbox.classList.contains('active')) {
          resetZoom();
          updateLightboxImage();
        }
      };

      const applyZoom = () => {
        elements.lightboxImage.style.transform =
          `translate(${zoomState.translateX}px, ${zoomState.translateY}px) scale(${zoomState.scale})`;
      };

      const resetZoom = () => {
        zoomState.scale = 1;
        zoomState.translateX = 0;
        zoomState.translateY = 0;
        zoomState.pointerId = null;
        zoomState.lastX = 0;
        zoomState.lastY = 0;
        zoomState.panning = false;
        pointerMap.clear();
        pinchState.startDistance = 0;
        pinchState.startScale = 1;
        pinchState.active = false;
        applyZoom();
      };

      const distanceBetweenPointers = () => {
        if (pointerMap.size < 2) return 0;
        const [p1, p2] = Array.from(pointerMap.values());
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
      };

      const handlePointerDown = (event) => {
        pointerMap.set(event.pointerId, { x: event.clientX, y: event.clientY });
        elements.lightboxCanvas.setPointerCapture?.(event.pointerId);

        if (pointerMap.size === 2) {
          pinchState.active = true;
          pinchState.startDistance = distanceBetweenPointers();
          pinchState.startScale = zoomState.scale;
        } else if (pointerMap.size === 1 && zoomState.scale > 1) {
          zoomState.panning = true;
          zoomState.pointerId = event.pointerId;
          zoomState.lastX = event.clientX;
          zoomState.lastY = event.clientY;
        }
      };

      const handlePointerMove = (event) => {
        if (!pointerMap.has(event.pointerId)) return;
        pointerMap.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (pinchState.active && pointerMap.size >= 2) {
          const distance = distanceBetweenPointers();
          if (distance && pinchState.startDistance) {
            const ratio = distance / pinchState.startDistance;
            zoomState.scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, pinchState.startScale * ratio));
            applyZoom();
          }
          return;
        }

        if (zoomState.panning && zoomState.pointerId === event.pointerId) {
          const dx = event.clientX - zoomState.lastX;
          const dy = event.clientY - zoomState.lastY;
          zoomState.translateX += dx;
          zoomState.translateY += dy;
          zoomState.lastX = event.clientX;
          zoomState.lastY = event.clientY;
          applyZoom();
        }
      };

      const handlePointerEnd = (event) => {
        pointerMap.delete(event.pointerId);

        if (pinchState.active && pointerMap.size < 2) {
          pinchState.active = false;
          pinchState.startDistance = 0;
        }

        if (zoomState.panning && zoomState.pointerId === event.pointerId) {
          zoomState.panning = false;
          zoomState.pointerId = null;
        }

        elements.lightboxCanvas.releasePointerCapture?.(event.pointerId);
      };

      const handleWheel = (event) => {
        event.preventDefault();
        const step = event.deltaY > 0 ? -0.25 : 0.25;
        const nextScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoomState.scale + step));
        if (nextScale === 1) {
          zoomState.translateX = 0;
          zoomState.translateY = 0;
        }
        zoomState.scale = nextScale;
        applyZoom();
      };

      const normalizeArrayValue = (raw) => {
        if (!raw) return [];
        if (Array.isArray(raw)) return raw;
        if (typeof raw === 'object' && Array.isArray(raw.files)) return raw.files;
        if (typeof raw === 'object' && Array.isArray(raw.list)) return raw.list;
        if (typeof raw === 'string') {
          const trimmed = raw.trim();
          if (!trimmed) return [];
          try {
            const parsed = JSON.parse(trimmed);
            if (Array.isArray(parsed)) return parsed;
          } catch (_) {}
          if (trimmed.includes('\n')) {
            return trimmed.split('\n').map((line) => line.trim()).filter(Boolean);
          }
          if (trimmed.includes(',')) {
            return trimmed.split(',').map((line) => line.trim()).filter(Boolean);
          }
          return [trimmed];
        }
        return [raw];
      };

      const fileUrlFromItem = (item) => {
        if (!item) return '';
        if (typeof item === 'string') return item;
        return (
          item.url ||
          item.value ||
          item.fileUrl ||
          item.fileurl ||
          item.file_path ||
          item.filePath ||
          item.path ||
          item.link ||
          ''
        );
      };

      const fileNameFromItem = (item, fallback = '') => {
        if (!item) return fallback;
        if (typeof item === 'string') {
          const parts = item.split('/');
          return parts[parts.length - 1] || fallback;
        }
        return (
          item.name ||
          item.originalName ||
          item.label ||
          item.filename ||
          item.title ||
          fallback
        );
      };

      const parseImageList = (raw) => {
        if (!raw) return [];
        try {
          const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (Array.isArray(parsed)) {
            return parsed
              .map((item, index) => {
                if (!item) return null;
                const url = fileUrlFromItem(item);
                if (!url) return null;
                const name = fileNameFromItem(item, `Imagem ${index + 1}`);
                return { name, url };
              })
              .filter(Boolean);
          }
        } catch (_) {}
        return [];
      };

      const extractLabels = (settings, primaryKey) => {
        if (!settings) return [];
        const preferredKeys = [
          'imagelabels',
          'labels',
          'names',
          'nomes',
          'titulos',
        ];
        if (primaryKey) {
          preferredKeys.push(`${primaryKey.toLowerCase()}labels`);
          preferredKeys.push(`${primaryKey.toLowerCase()}names`);
        }

        for (const key of Object.keys(settings)) {
          const normalizedKey = key.toLowerCase();
          if (preferredKeys.some((hint) => normalizedKey.includes(hint))) {
            const arr = normalizeArrayValue(settings[key]);
            if (arr.length) {
              return arr
                .map((value) => (typeof value === 'string' ? value.trim() : ''))
                .filter(Boolean);
            }
          }
        }
        return [];
      };

      const parseUploadsSetting = (rawUploads, labels = []) => {
        const uploads = normalizeArrayValue(rawUploads);
        if (!uploads.length) return [];

        return uploads
          .map((entry, index) => {
            const url = fileUrlFromItem(entry);
            if (!url) return null;
            const label = labels[index] || '';
            const fallbackName = fileNameFromItem(entry, `Imagem ${index + 1}`);
            return {
              name: label || fallbackName,
              url,
            };
          })
          .filter(Boolean);
      };

      const detectUploadsInSettings = (settings = {}) => {
        const hints = ['upload', 'file', 'imagem', 'image', 'galeria', 'gallery', 'arquivo'];

        for (const [key, value] of Object.entries(settings)) {
          if (value == null) continue;
          const normalizedKey = key.toLowerCase();
          const looksLikeUpload = hints.some((hint) => normalizedKey.includes(hint));
          const arr = normalizeArrayValue(value);
          const hasFileShape = arr.some((item) => {
            if (!item) return false;
            if (typeof item === 'string') {
              return item.startsWith('http') || item.includes('/');
            }
            return Boolean(fileUrlFromItem(item));
          });
          if (!arr.length || (!looksLikeUpload && !hasFileShape)) continue;

          const labels = extractLabels(settings, key);
          const parsed = parseUploadsSetting(arr, labels);
          if (parsed.length) {
            return { images: parsed, source: key };
          }
        }

        return null;
      };

      const applyImageSources = (value, settings = {}) => {
        const sources = [
          { images: parseImageList(value), source: 'valor salvo' },
          { images: parseImageList(settings.imageManifest), source: 'imageManifest' },
        ].filter((entry) => entry.images.length);

        if (!sources.length) {
          const uploads = detectUploadsInSettings(settings);
          if (uploads?.images.length) {
            sources.push({ images: uploads.images, source: uploads.source });
          }
        }

        const firstSource = sources.find((entry) => entry.images.length);

        if (!firstSource) {
          state.images = [];
          state.activeIndex = 0;
          updateMainView();
          console.warn('Nenhuma imagem configurada nas configuracoes do widget.');
          return;
        }

        state.images = firstSource.images.slice(0, MAX_FILES);
        state.activeIndex = 0;
        updateMainView();
        sendCurrentValue();
      };

      const setupEvents = () => {
        elements.zoomTrigger.addEventListener('click', openLightbox);
        elements.btnClose.addEventListener('click', (event) => {
          event.stopPropagation();
          closeLightbox();
        });

        elements.btnPrev.addEventListener('click', (event) => {
          event.stopPropagation();
          showImageOffset(-1);
        });

        elements.btnNext.addEventListener('click', (event) => {
          event.stopPropagation();
          showImageOffset(1);
        });

        elements.floatPrev.addEventListener('click', (event) => {
          event.stopPropagation();
          showImageOffset(-1);
        });

        elements.floatNext.addEventListener('click', (event) => {
          event.stopPropagation();
          showImageOffset(1);
        });

        elements.lightboxCanvas.addEventListener('pointerdown', handlePointerDown);
        elements.lightboxCanvas.addEventListener('pointermove', handlePointerMove);
        elements.lightboxCanvas.addEventListener('pointerup', handlePointerEnd);
        elements.lightboxCanvas.addEventListener('pointerleave', handlePointerEnd);
        elements.lightboxCanvas.addEventListener('pointercancel', handlePointerEnd);
        elements.lightboxCanvas.addEventListener('wheel', handleWheel, { passive: false });

        elements.lightbox.addEventListener('click', (event) => {
          if (event.target === elements.lightbox) {
            closeLightbox();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && elements.lightbox.classList.contains('active')) {
            event.preventDefault();
            closeLightbox();
          } else if (event.key === 'ArrowLeft') {
            if (elements.lightbox.classList.contains('active')) {
              event.preventDefault();
              showImageOffset(-1);
            }
          } else if (event.key === 'ArrowRight') {
            if (elements.lightbox.classList.contains('active')) {
              event.preventDefault();
              showImageOffset(1);
            }
          }
        });

        document.addEventListener('fullscreenchange', () => {
          if (!document.fullscreenElement && elements.lightbox.classList.contains('active')) {
            closeLightbox();
          }
        });
      };

      const setupJotformBridge = () => {
        if (jotformBridgeReady || !window.JFCustomWidget) return;
        jotformBridgeReady = true;

        JFCustomWidget.subscribe('ready', ({ value } = {}) => {
          const settings = window.JFCustomWidget.getWidgetSettings?.() || {};
          applyImageSources(value, settings);
        });

        JFCustomWidget.subscribe('submit', () => {
          JFCustomWidget.sendSubmit({
            valid: true,
            value: serializeImages(),
          });
        });
      };

      const bootstrap = () => {
        setupEvents();

        if (!window.JFCustomWidget) {
          if (Array.isArray(window.demoImages) && window.demoImages.length) {
            state.images = window.demoImages.slice(0, MAX_FILES);
            state.activeIndex = 0;
          }
          updateMainView();
        }

        setupJotformBridge();
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }

      window.onJotformWidgetReady = () => {
        setupJotformBridge();
      };
    })();
  </script>
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js?onload=onJotformWidgetReady"></script>
</body>
</html>
