<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Simple Image Viewer - JF Brain</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030712;
      --text: #ffffff;
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(255, 255, 255, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Previne scroll na pagina base */
    }

    /* --- Visualização Principal (Single View) --- */
    .main-viewer {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .image-container {
      position: relative;
      max-width: 100%;
      max-height: 80vh;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: zoom-in;
      transition: transform 0.2s ease;
    }

    .image-container:active {
      transform: scale(0.98);
    }

    .image-container img {
      display: block;
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      width: auto;
      height: auto;
    }

    .counter {
      margin-top: 16px;
      font-size: 0.9rem;
      opacity: 0.7;
      background: rgba(0,0,0,0.3);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .hidden { display: none !important; }

    /* --- Lightbox (Expandido) --- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .lightbox.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lightbox__canvas {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lightbox__canvas img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center;
      touch-action: none; /* Essencial para gestos customizados */
      user-select: none;
      -webkit-user-drag: none;
    }

    /* --- Controles do Lightbox --- */
    .control-btn {
      position: absolute;
      background: rgba(30, 30, 30, 0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }

    .control-btn:hover { background: rgba(80, 80, 80, 0.8); }
    .control-btn:disabled { opacity: 0.2; cursor: default; pointer-events: none; }

    .btn-close { top: 20px; right: 20px; font-size: 32px; background: transparent; }
    .btn-prev { left: 20px; top: 50%; transform: translateY(-50%); }
    .btn-next { right: 20px; top: 50%; transform: translateY(-50%); }

    /* Ajuste para Mobile */
    @media (max-width: 768px) {
      .btn-prev, .btn-next {
        width: 40px;
        height: 40px;
        font-size: 20px;
        background: rgba(0, 0, 0, 0.4);
      }
      .btn-prev { left: 10px; }
      .btn-next { right: 10px; }
    }

    .placeholder-msg {
      text-align: center;
      color: rgba(255,255,255,0.5);
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="main-viewer">
    <div id="mainImageWrapper" class="image-container hidden">
      <img id="mainImage" alt="Imagem Principal" />
    </div>
    <div id="counter" class="counter hidden">0 / 0</div>
    <div id="placeholder" class="placeholder-msg">
      Nenhuma imagem carregada.
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button id="closeLightbox" class="control-btn btn-close">&times;</button>
    
    <button id="prevBtn" class="control-btn btn-prev">&#10094;</button>
    
    <div id="lightboxCanvas" class="lightbox__canvas">
      <img id="lightboxImage" alt="Imagem Zoom" draggable="false" />
    </div>
    
    <button id="nextBtn" class="control-btn btn-next">&#10095;</button>
  </div>

  <script>
    (() => {
      // --- Constantes ---
      const MAX_ZOOM = 5;
      const ZOOM_STEP = 0.25;
      const MIN_ZOOM = 1;

      // --- Elementos DOM ---
      const els = {
        mainWrapper: document.getElementById('mainImageWrapper'),
        mainImage: document.getElementById('mainImage'),
        counter: document.getElementById('counter'),
        placeholder: document.getElementById('placeholder'),
        lightbox: document.getElementById('lightbox'),
        lightboxImage: document.getElementById('lightboxImage'),
        lightboxCanvas: document.getElementById('lightboxCanvas'),
        closeBtn: document.getElementById('closeLightbox'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
      };

      // --- Estado Global ---
      const state = {
        images: [],
        activeIndex: 0,
      };

      const zoomState = {
        scale: 1,
        translateX: 0,
        translateY: 0,
        panning: false,
        pointerId: null,
        lastX: 0,
        lastY: 0,
      };

      const pinchState = {
        active: false,
        startDistance: 0,
        startScale: 1,
      };

      const lightboxPointers = new Map();
      let jotformBridgeReady = false;

      // --- Funções Auxiliares de Dados (Mantidas para compatibilidade) ---
      const serializeImages = () => JSON.stringify(state.images);
      
      const normalizeArrayValue = (raw) => {
        if (!raw) return [];
        if (Array.isArray(raw)) return raw;
        if (typeof raw === 'string') {
            try { return JSON.parse(raw); } catch { return raw.includes(',') ? raw.split(',') : [raw]; }
        }
        return [raw];
      };

      const extractUrl = (item) => {
        if (!item) return '';
        return typeof item === 'string' ? item : (item.url || item.value || item.path || '');
      };

      // --- Renderização ---
      const updateView = () => {
        if (!state.images.length) {
          els.mainWrapper.classList.add('hidden');
          els.counter.classList.add('hidden');
          els.placeholder.classList.remove('hidden');
          return;
        }

        const currentImg = state.images[state.activeIndex];
        
        // Atualiza Main View
        els.mainImage.src = currentImg.url;
        els.mainWrapper.classList.remove('hidden');
        els.placeholder.classList.add('hidden');
        
        // Atualiza Contador
        els.counter.textContent = `${state.activeIndex + 1} / ${state.images.length}`;
        els.counter.classList.remove('hidden');

        // Atualiza botões de navegação
        updateNavButtons();
      };

      const updateNavButtons = () => {
        els.prevBtn.disabled = state.activeIndex === 0;
        els.nextBtn.disabled = state.activeIndex === state.images.length - 1;
        
        // Oculta botões se não houver navegação possível naquela direção
        els.prevBtn.style.opacity = state.activeIndex === 0 ? '0' : '1';
        els.nextBtn.style.opacity = state.activeIndex === state.images.length - 1 ? '0' : '1';
      };

      // --- Lightbox Logica ---
      const openLightbox = () => {
        if (!state.images.length) return;
        const img = state.images[state.activeIndex];
        els.lightboxImage.src = img.url;
        els.lightbox.classList.remove('hidden');
        resetZoom(true);
        updateNavButtons();
      };

      const closeLightbox = () => {
        els.lightbox.classList.add('hidden');
        resetZoom();
      };

      const navigate = (direction) => {
        const newIndex = state.activeIndex + direction;
        if (newIndex >= 0 && newIndex < state.images.length) {
          state.activeIndex = newIndex;
          
          // Efeito simples de transição no lightbox
          els.lightboxImage.style.opacity = '0.5';
          setTimeout(() => {
            els.lightboxImage.src = state.images[state.activeIndex].url;
            els.lightboxImage.style.opacity = '1';
            resetZoom(true);
            updateView(); // Sincroniza o fundo
          }, 150);
        }
      };

      // --- Zoom & Pan Engine (Matemática) ---
      const applyZoom = () => {
        els.lightboxImage.style.transform = 
          `translate(${zoomState.translateX}px, ${zoomState.translateY}px) scale(${zoomState.scale})`;
      };

      const resetZoom = (initial = false) => {
        zoomState.scale = 1;
        zoomState.translateX = 0;
        zoomState.translateY = 0;
        zoomState.panning = false;
        zoomState.pointerId = null;
        if (!initial) lightboxPointers.clear();
        applyZoom();
      };

      const distanceBetweenPointers = () => {
        if (lightboxPointers.size < 2) return 0;
        const [p1, p2] = Array.from(lightboxPointers.values());
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
      };

      // Eventos de Pointer (Mouse/Touch)
      const handlePointerDown = (e) => {
        lightboxPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        
        if (lightboxPointers.size === 2) {
          pinchState.active = true;
          pinchState.startDistance = distanceBetweenPointers();
          pinchState.startScale = zoomState.scale;
        } else if (lightboxPointers.size === 1 && zoomState.scale > 1) {
          zoomState.panning = true;
          zoomState.pointerId = e.pointerId;
          zoomState.lastX = e.clientX;
          zoomState.lastY = e.clientY;
        }
        els.lightboxCanvas.setPointerCapture?.(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (!lightboxPointers.has(e.pointerId)) return;
        lightboxPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // Lógica Pinça (Zoom)
        if (pinchState.active && lightboxPointers.size === 2) {
          const dist = distanceBetweenPointers();
          if (dist && pinchState.startDistance) {
            const ratio = dist / pinchState.startDistance;
            zoomState.scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, pinchState.startScale * ratio));
            applyZoom();
          }
          return;
        }

        // Lógica Pan (Arrastar)
        if (zoomState.panning && zoomState.pointerId === e.pointerId) {
          const dx = e.clientX - zoomState.lastX;
          const dy = e.clientY - zoomState.lastY;
          zoomState.translateX += dx;
          zoomState.translateY += dy;
          zoomState.lastX = e.clientX;
          zoomState.lastY = e.clientY;
          applyZoom();
        }
      };

      const handlePointerUp = (e) => {
        lightboxPointers.delete(e.pointerId);
        if (lightboxPointers.size < 2) pinchState.active = false;
        if (zoomState.pointerId === e.pointerId) zoomState.panning = false;
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const direction = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
        const nextScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoomState.scale + direction));
        zoomState.scale = nextScale;
        if (nextScale === 1) { zoomState.translateX = 0; zoomState.translateY = 0; }
        applyZoom();
      };

      // --- Setup Inicial ---
      const loadImages = (sourceData) => {
        const raw = normalizeArrayValue(sourceData);
        state.images = raw.map((item, idx) => ({
          url: extractUrl(item),
          name: item.name || `Imagem ${idx+1}`
        })).filter(i => i.url);
        
        state.activeIndex = 0;
        updateView();
      };

      const setupEvents = () => {
        // Abertura
        els.mainWrapper.addEventListener('click', openLightbox);
        
        // Fechamento
        els.closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
        // Clicar fora da imagem fecha (opcional, mas comum)
        els.lightbox.addEventListener('click', (e) => {
            if(e.target === els.lightbox || e.target === els.lightboxCanvas) closeLightbox();
        });

        // Navegação
        els.prevBtn.addEventListener('click', (e) => { e.stopPropagation(); navigate(-1); });
        els.nextBtn.addEventListener('click', (e) => { e.stopPropagation(); navigate(1); });

        // Zoom & Pan
        els.lightboxCanvas.addEventListener('pointerdown', handlePointerDown);
        els.lightboxCanvas.addEventListener('pointermove', handlePointerMove);
        els.lightboxCanvas.addEventListener('pointerup', handlePointerUp);
        els.lightboxCanvas.addEventListener('pointercancel', handlePointerUp);
        els.lightboxCanvas.addEventListener('wheel', handleWheel, { passive: false });

        // Teclado
        document.addEventListener('keydown', (e) => {
          if (els.lightbox.classList.contains('hidden')) return;
          if (e.key === 'Escape') closeLightbox();
          if (e.key === 'ArrowLeft') navigate(-1);
          if (e.key === 'ArrowRight') navigate(1);
        });
      };

      const initJotform = () => {
        if (window.JFCustomWidget) {
            JFCustomWidget.subscribe('ready', (data) => {
                // Tenta pegar imagens dos settings ou do value salvo
                const settings = JFCustomWidget.getWidgetSettings();
                // Prioridade: Value Salvo > Settings > Demo
                let src = data.value;
                if (!src && settings.images) src = settings.images; 
                
                // Logica de "adivinhar" uploads (simplificada da anterior)
                if(!src) {
                   // Fallback básico para procurar chaves comuns
                   const keys = Object.keys(settings);
                   const imgKey = keys.find(k => k.toLowerCase().includes('upload') || k.toLowerCase().includes('imag'));
                   if(imgKey) src = settings[imgKey];
                }

                loadImages(src);
            });
            
            JFCustomWidget.subscribe('submit', () => {
                JFCustomWidget.sendSubmit({ valid: true, value: serializeImages() });
            });
        }
      };

      // Boot
      setupEvents();
      initJotform();

      // Demo fallback se rodar fora do Jotform
      if (!window.JFCustomWidget) {
         // window.demoImages = [{url: '...'}]; // Para testes locais
      }

    })();
  </script>
  <script src="https://js.jotform.com/JFCustomWidget.min.js"></script>
</body>
</html>
