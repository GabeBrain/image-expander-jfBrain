<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Expander - JF Brain</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030712;
      --canvas: #050a18;
      --placeholder: rgba(255, 255, 255, 0.65);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #03050c, #050a18, #010208);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(8px, 4vw, 40px);
    }

    .carousel {
      width: min(1200px, 100%);
    }

    .carousel__viewport {
      width: 100%;
      border-radius: clamp(16px, 3vw, 32px);
      overflow: hidden;
      background: linear-gradient(135deg, rgba(8, 13, 25, 0.95), rgba(9, 17, 39, 0.75));
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.55);
      min-height: clamp(280px, 65vh, 720px);
      touch-action: pan-y;
      position: relative;
    }

    body.orientation-landscape .carousel__viewport {
      min-height: clamp(320px, 90vh, 900px);
    }

    .carousel__track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.35s ease;
      will-change: transform;
    }

    .carousel__slide {
      flex: 0 0 100%;
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .carousel__slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: clamp(12px, 2vw, 24px);
      box-shadow:
        0 25px 60px rgba(5, 12, 28, 0.8),
        0 2px 6px rgba(0, 0, 0, 0.5);
      cursor: zoom-in;
      transition: transform 0.2s ease;
      background: #000;
    }

    .carousel__slide img:active {
      transform: scale(0.99);
    }

    .carousel__placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--placeholder);
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      letter-spacing: 0.02em;
      padding: 24px;
      background: rgba(0, 0, 0, 0.2);
    }

    .hidden {
      display: none !important;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      touch-action: none;
      opacity: 1;
    }

    .lightbox.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lightbox__close {
      position: fixed;
      top: clamp(12px, 3vw, 32px);
      right: clamp(12px, 3vw, 32px);
      width: clamp(40px, 5vw, 56px);
      height: clamp(40px, 5vw, 56px);
      border-radius: 999px;
      border: none;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      cursor: pointer;
      z-index: 1000;
    }

    .lightbox__canvas {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox__canvas img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center;
      cursor: grab;
      touch-action: none;
    }

    .lightbox__canvas img:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="carousel">
      <div id="carouselViewport" class="carousel__viewport" aria-live="polite">
        <div id="carouselTrack" class="carousel__track" role="list"></div>
        <div id="placeholder" class="carousel__placeholder">
          Nenhuma imagem configurada neste widget.
        </div>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button id="closeLightbox" class="lightbox__close" aria-label="Fechar">&times;</button>
    <div id="lightboxCanvas" class="lightbox__canvas">
      <img id="lightboxImage" alt="Imagem ampliada" draggable="false" />
    </div>
  </div>

  <script>
    (() => {
      const MAX_FILES = 15;
      const SWIPE_THRESHOLD = 45;
      const MAX_ZOOM = 5;
      const ZOOM_STEP = 0.25;

      const track = document.getElementById('carouselTrack');
      const viewport = document.getElementById('carouselViewport');
      const placeholder = document.getElementById('placeholder');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxCanvas = document.getElementById('lightboxCanvas');
      const closeLightboxBtn = document.getElementById('closeLightbox');

      const state = {
        images: [],
        activeIndex: null,
      };

      const pointerState = {
        active: false,
        startX: 0,
        deltaX: 0,
        pointerId: null,
      };

      const zoomState = {
        scale: 1,
        translateX: 0,
        translateY: 0,
        panning: false,
        pointerId: null,
        lastX: 0,
        lastY: 0,
      };

      const lightboxPointers = new Map();
      const pinchState = {
        active: false,
        startDistance: 0,
        startScale: 1,
      };

      let jotformBridgeReady = false;

      const serializeImages = () => JSON.stringify(state.images);

      const sendCurrentValue = (context = 'sync') => {
        if (window.JFCustomWidget?.sendData) {
          window.JFCustomWidget.sendData({ value: serializeImages(), context });
        }
      };

      const updateTrackPosition = () => {
        if (!state.images.length) {
          track.style.transform = 'translate3d(0, 0, 0)';
          return;
        }

        const offsetPercent = (state.activeIndex ?? 0) * -100;
        track.style.transform = `translate3d(${offsetPercent}%, 0, 0)`;
      };

      const goToSlide = (index) => {
        if (!state.images.length) return;
        const nextIndex = Math.max(0, Math.min(index, state.images.length - 1));
        if (nextIndex === state.activeIndex) return;
        state.activeIndex = nextIndex;
        updateTrackPosition();
      };

      const openLightbox = (index) => {
        if (!state.images[index]) return;
        state.activeIndex = index;
        updateTrackPosition();

        lightboxImage.src = state.images[index].url;
        lightboxImage.alt = state.images[index].name || `Imagem ${index + 1}`;
        lightbox.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        resetZoom(true);
      };

      const closeLightbox = () => {
        lightbox.classList.add('hidden');
        document.body.style.overflow = '';
        resetZoom();
      };

      const applyZoom = () => {
        lightboxImage.style.transform =
          `translate(${zoomState.translateX}px, ${zoomState.translateY}px) scale(${zoomState.scale})`;
      };

      const resetZoom = (initial = false) => {
        zoomState.scale = 1;
        zoomState.translateX = 0;
        zoomState.translateY = 0;
        zoomState.panning = false;
        zoomState.pointerId = null;
        if (!initial) {
          lightboxPointers.clear();
          pinchState.active = false;
        }
        applyZoom();
      };

      const updateZoom = (step) => {
        const nextScale = Math.min(MAX_ZOOM, Math.max(1, zoomState.scale + step));
        if (nextScale === 1) {
          zoomState.translateX = 0;
          zoomState.translateY = 0;
        }
        zoomState.scale = nextScale;
        applyZoom();
      };

      const renderSlides = () => {
        track.innerHTML = '';

        if (!state.images.length) {
          placeholder.classList.remove('hidden');
          state.activeIndex = null;
          updateTrackPosition();
          return;
        }

        placeholder.classList.add('hidden');

        state.images.forEach(({ url, name }, index) => {
          const slide = document.createElement('figure');
          slide.className = 'carousel__slide';
          slide.setAttribute('role', 'group');
          slide.setAttribute('aria-roledescription', 'slide');
          slide.setAttribute('aria-label', `Imagem ${index + 1}`);

          const img = document.createElement('img');
          img.src = url;
          img.alt = name || `Imagem ${index + 1}`;
          img.draggable = false;

          img.addEventListener('click', () => openLightbox(index));

          slide.appendChild(img);
          track.appendChild(slide);
        });

        if (state.activeIndex === null) {
          state.activeIndex = 0;
        } else if (state.activeIndex > state.images.length - 1) {
          state.activeIndex = state.images.length - 1;
        }

        updateTrackPosition();
      };

      const resetView = () => {
        state.images = [];
        state.activeIndex = null;
        track.innerHTML = '';
        placeholder.classList.remove('hidden');
        updateTrackPosition();
      };

      const parseImageList = (raw) => {
        if (!raw) return [];
        try {
          const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (Array.isArray(parsed)) {
            return parsed
              .map((item, index) => {
                if (!item) return null;
                const url = item.url || item.value || item.path;
                if (!url) return null;
                const name = item.name || item.label || `Imagem ${index + 1}`;
                return { name, url };
              })
              .filter(Boolean);
          }
        } catch (error) {
          console.warn('Nao foi possivel interpretar a lista de imagens:', error);
        }
        return [];
      };

      const normalizeArrayValue = (raw) => {
        if (!raw) return [];
        if (Array.isArray(raw)) return raw;
        if (typeof raw === 'object' && Array.isArray(raw.files)) return raw.files;
        if (typeof raw === 'object' && Array.isArray(raw.list)) return raw.list;
        if (typeof raw === 'string') {
          const trimmed = raw.trim();
          if (!trimmed) return [];
          try {
            const parsed = JSON.parse(trimmed);
            if (Array.isArray(parsed)) return parsed;
          } catch (_) {}
          if (trimmed.includes('\n')) {
            return trimmed.split('\n').map((line) => line.trim()).filter(Boolean);
          }
          if (trimmed.includes(',')) {
            return trimmed.split(',').map((line) => line.trim()).filter(Boolean);
          }
          return [trimmed];
        }
        return [raw];
      };

      const extractLabels = (settings, primaryKey) => {
        if (!settings) return [];
        const preferredKeys = [
          'imagelabels',
          'labels',
          'names',
          'nomes',
          'titulos',
        ];
        if (primaryKey) {
          preferredKeys.push(`${primaryKey.toLowerCase()}labels`);
          preferredKeys.push(`${primaryKey.toLowerCase()}names`);
        }

        for (const key of Object.keys(settings)) {
          const normalizedKey = key.toLowerCase();
          if (preferredKeys.some((hint) => normalizedKey.includes(hint))) {
            const arr = normalizeArrayValue(settings[key]);
            if (arr.length) {
              return arr.map((value) => (typeof value === 'string' ? value.trim() : '')).filter(Boolean);
            }
          }
        }
        return [];
      };

      const fileUrlFromItem = (item) => {
        if (!item) return '';
        if (typeof item === 'string') return item;
        return (
          item.url ||
          item.value ||
          item.fileUrl ||
          item.fileurl ||
          item.file_path ||
          item.filePath ||
          item.path ||
          item.link ||
          ''
        );
      };

      const fileNameFromItem = (item, fallback = '') => {
        if (!item) return fallback;
        if (typeof item === 'string') {
          const parts = item.split('/');
          return parts[parts.length - 1] || fallback;
        }
        return (
          item.name ||
          item.originalName ||
          item.label ||
          item.filename ||
          item.title ||
          fallback
        );
      };

      const parseUploadsSetting = (rawUploads, labels = []) => {
        const uploads = normalizeArrayValue(rawUploads);
        if (!uploads.length) return [];

        return uploads
          .map((entry, index) => {
            const url = fileUrlFromItem(entry);
            if (!url) return null;
            const label = labels[index] || '';
            const fallbackName = fileNameFromItem(entry, `Imagem ${index + 1}`);
            return {
              name: label || fallbackName,
              url,
            };
          })
          .filter(Boolean);
      };

      const detectUploadsInSettings = (settings = {}) => {
        const hints = ['upload', 'file', 'imagem', 'image', 'galeria', 'gallery', 'arquivo'];

        for (const [key, value] of Object.entries(settings)) {
          if (value == null) continue;
          const normalizedKey = key.toLowerCase();
          const looksLikeUpload = hints.some((hint) => normalizedKey.includes(hint));
          const arr = normalizeArrayValue(value);
          const hasFileShape = arr.some((item) => {
            if (!item) return false;
            if (typeof item === 'string') {
              return item.startsWith('http') || item.includes('/');
            }
            return Boolean(fileUrlFromItem(item));
          });
          if (!arr.length || (!looksLikeUpload && !hasFileShape)) continue;

          const labels = extractLabels(settings, key);
          const parsed = parseUploadsSetting(arr, labels);
          if (parsed.length) {
            return { images: parsed, source: key };
          }
        }

        return null;
      };

      const applyImageSources = (value, settings = {}) => {
        const sources = [
          { images: parseImageList(value), source: 'valor salvo' },
          { images: parseImageList(settings.imageManifest), source: 'imageManifest' },
        ].filter((entry) => entry.images.length);

        if (!sources.length) {
          const uploads = detectUploadsInSettings(settings);
          if (uploads?.images.length) {
            sources.push({ images: uploads.images, source: uploads.source });
          }
        }

        const firstSource = sources.find((entry) => entry.images.length);

        if (!firstSource) {
          resetView();
          console.warn('Nenhuma imagem configurada nas configuracoes do widget.');
          return;
        }

        state.images = firstSource.images.slice(0, MAX_FILES);
        state.activeIndex = 0;
        renderSlides();
      };

      const startPointer = (event) => {
        if (!state.images.length) return;
        pointerState.active = true;
        pointerState.startX = event.clientX;
        pointerState.deltaX = 0;
        pointerState.pointerId = event.pointerId;
        viewport.setPointerCapture?.(event.pointerId);
      };

      const movePointer = (event) => {
        if (!pointerState.active || pointerState.pointerId !== event.pointerId) return;
        pointerState.deltaX = event.clientX - pointerState.startX;
      };

      const endPointer = () => {
        if (!pointerState.active) return;
        if (Math.abs(pointerState.deltaX) > SWIPE_THRESHOLD) {
          if (pointerState.deltaX < 0) {
            goToSlide((state.activeIndex ?? 0) + 1);
          } else {
            goToSlide((state.activeIndex ?? 0) - 1);
          }
        }

        if (pointerState.pointerId !== null) {
          viewport.releasePointerCapture?.(pointerState.pointerId);
        }

        pointerState.active = false;
        pointerState.startX = 0;
        pointerState.deltaX = 0;
        pointerState.pointerId = null;
      };

      const cancelPointer = () => {
        pointerState.active = false;
        pointerState.startX = 0;
        pointerState.deltaX = 0;
        pointerState.pointerId = null;
      };

      const distanceBetweenPointers = () => {
        if (lightboxPointers.size < 2) return 0;
        const points = Array.from(lightboxPointers.values());
        const [p1, p2] = points;
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
      };

      const handleLightboxPointerDown = (event) => {
        lightboxPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (lightboxPointers.size === 2) {
          pinchState.active = true;
          pinchState.startDistance = distanceBetweenPointers();
          pinchState.startScale = zoomState.scale;
        } else if (lightboxPointers.size === 1 && zoomState.scale > 1) {
          zoomState.panning = true;
          zoomState.pointerId = event.pointerId;
          zoomState.lastX = event.clientX;
          zoomState.lastY = event.clientY;
        }

        lightboxCanvas.setPointerCapture?.(event.pointerId);
      };

      const handleLightboxPointerMove = (event) => {
        if (!lightboxPointers.has(event.pointerId)) return;
        lightboxPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (pinchState.active && lightboxPointers.size >= 2) {
          const distance = distanceBetweenPointers();
          if (distance && pinchState.startDistance) {
            const ratio = distance / pinchState.startDistance;
            const nextScale = Math.min(MAX_ZOOM, Math.max(1, pinchState.startScale * ratio));
            zoomState.scale = nextScale;
            applyZoom();
          }
          return;
        }

        if (zoomState.panning && zoomState.pointerId === event.pointerId) {
          const dx = event.clientX - zoomState.lastX;
          const dy = event.clientY - zoomState.lastY;
          zoomState.lastX = event.clientX;
          zoomState.lastY = event.clientY;
          zoomState.translateX += dx;
          zoomState.translateY += dy;
          applyZoom();
        }
      };

      const handleLightboxPointerEnd = (event) => {
        lightboxPointers.delete(event.pointerId);

        if (pinchState.active && lightboxPointers.size < 2) {
          pinchState.active = false;
          pinchState.startDistance = 0;
        }

        if (zoomState.panning && zoomState.pointerId === event.pointerId) {
          zoomState.panning = false;
          zoomState.pointerId = null;
        }

        lightboxCanvas.releasePointerCapture?.(event.pointerId);
      };

      const handleWheelZoom = (event) => {
        event.preventDefault();
        const direction = event.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
        updateZoom(direction);
      };

      const setupJotformBridge = () => {
        if (jotformBridgeReady || !window.JFCustomWidget) return;
        jotformBridgeReady = true;

        JFCustomWidget.subscribe('ready', ({ value } = {}) => {
          const settings = window.JFCustomWidget.getWidgetSettings?.() || {};
          applyImageSources(value, settings);
          sendCurrentValue('ready');
        });

        JFCustomWidget.subscribe('submit', () => {
          JFCustomWidget.sendSubmit({
            valid: true,
            value: serializeImages(),
          });
        });
      };

      const handleOrientationClass = () => {
        const mq = window.matchMedia('(orientation: landscape)');
        const apply = () => {
          const isLandscape = mq.matches || window.innerWidth > window.innerHeight;
          document.body.classList.toggle('orientation-landscape', isLandscape);
        };
        apply();
        if (mq.addEventListener) {
          mq.addEventListener('change', () => {
            apply();
            updateTrackPosition();
          });
        } else if (mq.addListener) {
          mq.addListener(() => {
            apply();
            updateTrackPosition();
          });
        }
        window.addEventListener('resize', () => {
          apply();
          updateTrackPosition();
        });
      };

      const bootstrap = () => {
        handleOrientationClass();

        if (!window.JFCustomWidget) {
          if (Array.isArray(window.demoImages) && window.demoImages.length) {
            state.images = window.demoImages.slice(0, MAX_FILES);
            state.activeIndex = 0;
            renderSlides();
          } else {
            resetView();
          }
        }
        setupJotformBridge();
      };

      viewport.addEventListener('pointerdown', startPointer);
      viewport.addEventListener('pointermove', movePointer);
      viewport.addEventListener('pointerup', endPointer);
      viewport.addEventListener('pointercancel', cancelPointer);
      viewport.addEventListener('pointerleave', cancelPointer);

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') {
          goToSlide((state.activeIndex ?? 0) - 1);
        } else if (event.key === 'ArrowRight') {
          goToSlide((state.activeIndex ?? 0) + 1);
        } else if (event.key === 'Escape' && !lightbox.classList.contains('hidden')) {
          closeLightbox();
        }
      });

      lightboxCanvas.addEventListener('pointerdown', handleLightboxPointerDown);
      lightboxCanvas.addEventListener('pointermove', handleLightboxPointerMove);
      lightboxCanvas.addEventListener('pointerup', handleLightboxPointerEnd);
      lightboxCanvas.addEventListener('pointerleave', handleLightboxPointerEnd);
      lightboxCanvas.addEventListener('pointercancel', handleLightboxPointerEnd);
      lightboxCanvas.addEventListener('wheel', handleWheelZoom, { passive: false });

      closeLightboxBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }

      window.onJotformWidgetReady = () => {
        setupJotformBridge();
      };

      if (window.JFCustomWidget) {
        setupJotformBridge();
      }
    })();
  </script>
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js?onload=onJotformWidgetReady"></script>
</body>
</html>
